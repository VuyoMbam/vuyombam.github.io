project: 
  type: website
  output-dir: docs
  # Quarto empties docs/ on every full render, so anything that must survive
  # (Google Search Console verification, robots.txt) is kept in the project
  # root and copied across from here.
  resources:
    - googlecf6de51e88026b7b.html
    - robots.txt
    - assets/fonts/*
    - assets/vendor/*      # plotly.js, served from this site (see site_utils/charts.py)
    # Favicon and app icons (must sit at the site root so browsers and Google find them)
    - favicon.svg
    - favicon.ico
    - apple-touch-icon.png
    - icon-192.png
    - icon-512.png
    - site.webmanifest


website: 
  title: "Energy with Vuyo Mbam"
  description: "Official website of Vuyo Mbam, an Energy Sector Analyst & Advisor providing insights on energy system transitions, energy policy, economic impacts with a particular focus on the South African market"
  image: images/A16A0288.jpg
  image-alt: "Portrait of Vuyo Mbam"
  open-graph: 
    site-name: "Vuyo Mbam"
  twitter-card: true
  search: true
  site-url: "https://vuyombam.github.io"
  page-navigation: true
  navbar:
    search: true
    left: 
      - icon: book
        text: "Articles"
        href: articles.qmd
    right: 
      - icon: envelope
        text: "Contact"
        href: index.qmd#contact
      - icon: linkedin
        href: https://www.linkedin.com/in/vuyo-mbam-495316184/
        aria-label: LinkedIn
        target: _blank
        rel: "noopener noreferrer"
      - icon: github
        href: https://github.com/VuyoMbam
        aria-label: Github
        target: _blank
        rel: "noopener noreferrer"
    toggle-position: right
    pinned: true

  page-footer: 
    center: "© 2025–2026, Vuyo Mbam · [Privacy](/privacy.qmd)"


      
format: 
  html: 
    anchor-sections: false
    canonical-url: true
    html-math-method: mathml     # the site has no maths; this stops Quarto loading MathJax from a CDN
    page-layout: full
    # Light is the default; the navbar toggle switches to dark and remembers the choice.
    theme:
      light: [styles-light.scss]
      dark: [styles-dark.scss]
    respect-user-color-scheme: false
    include-in-header:
      text: |
        <link rel="preload" href="/assets/fonts/Questrial-latin.woff2" as="font" type="font/woff2" crossorigin>
        <script>document.documentElement.classList.add('js');</script>
        <script>
          // Links that open a new tab must not hand the new page a handle on this one.
          // Runs on `load`, after Quarto has added target="_blank" to external links.
          window.addEventListener('load', function () {
            document.querySelectorAll('a[target="_blank"]').forEach(function (a) {
              var rel = (a.getAttribute('rel') || '').split(/\s+/).filter(Boolean);
              ['noopener', 'noreferrer'].forEach(function (r) { if (rel.indexOf(r) < 0) rel.push(r); });
              a.setAttribute('rel', rel.join(' '));
            });
          });
        </script>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <link rel="icon" href="/favicon.ico" sizes="48x48">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#1E4038">
        <script>
          // Plotly measures text when it draws; redraw once Questrial has loaded so labels fit.
          document.fonts && document.fonts.ready.then(function () {
            if (!window.Plotly) return;
            document.querySelectorAll('.js-plotly-plot').forEach(function (g) { Plotly.Plots.resize(g); });
          });
        </script>
        <script>
          // Name the light/dark toggle for screen readers and tooltips, and keep it in step with the mode.
          document.addEventListener('DOMContentLoaded', function () {
            var toggles = document.querySelectorAll('.quarto-color-scheme-toggle');
            function update() {
              var label = document.body.classList.contains('quarto-dark') ? 'Switch to light mode' : 'Switch to dark mode';
              toggles.forEach(function (t) {
                t.title = label;
                t.setAttribute('aria-label', label);
                t.setAttribute('role', 'button');
              });
            }
            update();
            new MutationObserver(update).observe(document.body, { attributes: true, attributeFilter: ['class'] });
          });
        </script>
    toc: false

